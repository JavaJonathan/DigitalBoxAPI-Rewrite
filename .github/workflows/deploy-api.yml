name: Deploy API

on:
  push:
    branches: [master]

permissions:
  id-token: write # required for OIDC -> AWS role assumption
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy via SSM Run Command
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy DigitalBoxApi" \
            --parameters commands="[
              \"/usr/local/bin/render-digitalbox-env.sh\",
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY\",
              \"docker pull $REGISTRY/$ECR_REPOSITORY:latest\",
              \"docker stop digitalbox-api || true\",
              \"docker rm digitalbox-api || true\",
              \"docker run -d --name digitalbox-api --restart unless-stopped --memory=512m --memory-swap=1536m --log-opt max-size=10m --log-opt max-file=3 -p 8081:8080 --env-file /etc/digitalbox-api.env $REGISTRY/$ECR_REPOSITORY:latest\",
              \"docker image prune -f\"
            ]" \
            --region "$AWS_REGION"
